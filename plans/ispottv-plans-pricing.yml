    gate: Subscription required for /v4/metrics/conversions/{TC-id}
  - name: Unified Measurement / OTT
    gate: Pixel implementation plus subscription
  - name: Streaming Competitive
    gate: Data available from 2023-03-20
  - name: Streaming Verification
    gate: Separate module
  - name: Advanced Audiences
    gate: Permissioning controls added in v4.36.1
  - name: Integrated User Level Data (IULD)
    gate: Not available via the REST API at all; separate access request
