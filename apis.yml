apis:
- name: iSpot REST API v4
  description: >-
    REST API for accessing iSpot.tv TV and video ad measurement data — airing
    occurrence, estimated spend, household and person-level impressions,
    attention metrics, OTT/streaming impressions, TV conversion attribution and
    lift, plus the reference entities behind them (spots, creatives, brands,
    industries, networks, shows, episodes, products). OAuth 2.0 client
    credentials; JSON responses with a data + meta envelope, bracketed
    filter[]/page[] parameters and comma-separated include expansion; errors are
    RFC 9457 application/problem+json. Per-endpoint rate limits are published.
    The full endpoint reference and the interactive API demo are gated behind a
    developer-site account, but the conventions, filters, rate limits, changelog
    and Python samples are public.
  humanURL: https://developer.ispot.tv/
  baseURL: https://api.ispot.tv/v4
  x-base-url-note: >-
    baseURL corrected 2026-08-13 from https://developer.ispot.tv/api/v4 (the gated
    API-reference page on the developer portal, which returns HTTP 401 HTML) to
    https://api.ispot.tv/v4, the host iSpot names in its own public docs — the
    Python sample at developer.ispot.tv/documentation/python/base-template, the
    API Integration Guide PDF, the glossary and every example URL on the
    best-practices pages. Probed: https://api.ispot.tv/v4/brands returns HTTP 401
    application/problem+json and https://api.ispot.tv/v4/oauth2/token returns a
    live OAuth 2.0 error, confirming the API host.
  properties:
