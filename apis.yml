  - type: RateLimits
    url: rate-limits/ispottv-rate-limits.yml
  - type: DataModel
    url: data-model/ispottv-data-model.yml
- name: iSpot Impression & TV Conversion Pixel API v2
  description: >-
    Server-side and client-side measurement ingest endpoints. A 1x1 GIF pixel
    accepts OTT/CTV/digital impression events (pi.ispot.tv) and TV conversion
    events (pt.ispot.tv) keyed by a client-specific tracking code in the form
    TC-####-#, with campaign, channel, creative, placement, device, publisher and
    segment passed as query parameters. Server-side callers re-create the browser
    context via X-Forwarded-For, User-Agent and a datetime query parameter. A
    separate staging host (staging-pi.ispot.tv) is used for QA before production.
  humanURL: https://developer.ispot.tv/documentation/unified-measurement
  baseURL: https://pi.ispot.tv/v2
