name: iSpot.tv
description: >-
  iSpot.tv is a TV and video advertising measurement company that provides
  end-to-end measurement unifying creative assessment, audience measurement,
  and outcome attribution across linear TV and streaming. Its platform draws on
  data from tens of millions of smart TVs and set-top boxes to track ad
  occurrences, impressions, share of voice, creative effectiveness, and return
  on ad spend for advertisers, agencies, and networks. iSpot exposes its data
  programmatically through the iSpot REST API (v4), documented at a dedicated
  developer portal with quickstarts, an API reference, a Python sample, an
  interactive API demo tool, and release notes. iSpot.tv is backed by Insight
  Partners and was added to the API Evangelist network from that portfolio.
