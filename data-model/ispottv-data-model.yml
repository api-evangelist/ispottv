metric_surfaces:
  note: >-
    The /v4/metrics/* family is not a set of entities but projections over the
    graph above. iSpot documents them as ADDITIVE — each wider surface returns
    the narrower one plus its own metrics.
  additive_chain:
  - '/v4/metrics/tv/airings — airing level: time, spot, network, est_spend'
  - '/v4/metrics/audience/airings = tv/airings + impressions'
  - '/v4/metrics/attention/airings = audience/airings + attention metrics'
  - '/v4/metrics/conversions/{TC-####-#}/airings = audience/airings + conversion metrics'
  granularity_note: >-
    'airings' in each path may be swapped for 'spots' or 'networks' for coarser
    granularity.
  other_surfaces:
  - /v4/metrics/competitive/{dimension}..{dimension}
  - /v4/metrics/verified/audience
  - /v4/metrics/verified/continuous-play
  - /v4/metrics/ott
  - /v4/metrics/ott/conversions
  - /v4/metrics/ott/{site_id}/lift/publisher
  - /v4/metrics/ott/{site_id}/lift/summary
  - /v4/metrics/conversions/{id}/lift/availability
  - /v4/metrics/conversions/{id}/types
  - /v4/metrics/conversions/{id}/custom-data
  - /v4/metrics/attention/dates
  - /v4/metrics/impressions/ott
  - /v4/planning
  grouping:
    param: 'filter[group_by]'
    values:
      I: Industry
      P: Parent Brand
      B: Brand
      A: Spot
      C: Creative
      N: Network
      S: Show
      E: Episode
      H: Schedule
      W: Day of Week
      D: Day Part
      T: Date (EST, DST-aware)
      M: Month
      K: Week
      G: Sub-Genre
      F: Genre
      R: Duration
      Y: Delta Date
