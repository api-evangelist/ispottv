api: iSpot REST API v4
scope: per-endpoint (applied per API client)
exhaustion_status: 429
limit_count: 19
note: >-
  iSpot publishes a per-endpoint rate-limit table on its public developer site.
  Two pages carry the table and they DISAGREE on three endpoints — the dedicated
  /documentation/api/rate-limits page is treated as current and the older
  data-availability copy (last updated 7/24/2023) is recorded as `variant` so a
  consumer sees the discrepancy rather than one number presented as certain.
  iSpot states limits may change without notice.
response_headers:
  documented: true
  names_published: false
  described:
  - maximum number of requests permitted per minute
  - number of requests remaining in the current rate limit window
  - seconds (UTC) until the current rate limit window resets
  note: >-
    iSpot's Integration Guide describes three rate-limit response headers but
    never names them, and they are not observable on an unauthenticated request
    (which is rejected at 401 before the limiter reports). An agent cannot bind
    to the runtime signal without credentials — this is the single biggest
    agent-readiness gap on this API.
  retry_after: unknown
